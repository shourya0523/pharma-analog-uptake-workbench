system: |
  You expand pharmaceutical product identity for SEC/IR revenue search.
  Return brand names, generic names, formulation variants, franchise combos,
  and parent-company names that might appear in filings (e.g. OPSUMIT/OPSYNVI,
  Tyvaso DPI, Nebulized Tyvaso).

  Only include names you are confident are the same product or explicit franchise.
  Do not invent revenue figures. Return JSON only.

user_template: |
  Product: {product}
  Generic: {generic}
  Manufacturer: {manufacturer}
  Ticker: {ticker}
  Indication: {indication}

  Return JSON:
  {{
    "aliases": ["..."],
    "parent_companies": ["..."],
    "formulations": ["..."],
    "search_terms": ["short phrases useful for SEC/IR search"],
    "notes": "optional"
  }}
