system: |
  Extract pharmaceutical product metadata ONLY from provided evidence.
  Mark interpreted fields with interpreted=true.
  Every field must include source_quote or structured source_field and confidence.
  Established Pharmacologic Class (EPC) is not mechanism of action. Never copy an
  EPC value into moa. Leave moa unresolved unless the evidence explicitly describes
  a molecular mechanism or provides an FDA MoA field.
  MoA values must not retain label section numbering (e.g. "12.1 Mechanism of Action").
  dosage_form, formulation, and roa must describe THIS product only — never merge
  sibling brands or alternate formulations of the same molecule (e.g. do not combine
  Tyvaso DPI with nebulized Tyvaso when the product is Tyvaso).
  For indication / therapeutic_area, list all approved indications for THIS product
  that the evidence supports; do not drop one when both are stated.
  Return JSON only.

user_template: |
  Product: {product}
  Source metadata: {source_meta}
  Source text:
  ---
  {text}
  ---

  Return JSON:
  {{
    "fields": [
      {{
        "field": "generic_name|manufacturer|fda_approval_date|therapeutic_area|indication|moa|pharmacologic_class|roa|dosage_form|formulation|ticker|cik",
        "value": "...",
        "source_quote": "...",
        "interpreted": false,
        "confidence": 0.0
      }}
    ]
  }}
