[project]
name = "pharma-uptake-backend"
version = "0.1.0"
description = "Pharmaceutical Analog Uptake Workbench API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0.2",
  "boto3>=1.35.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]